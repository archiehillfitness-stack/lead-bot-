<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Leads{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5f6b7a;
    --line: #e3e6ea; --accent: #1f6feb; --warn: #b54708; --warn-bg: #fff4e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #171b21; --text: #e6e9ed; --muted: #97a1ad;
      --line: #2a3038; --accent: #58a6ff; --warn: #f0a050; --warn-bg: #3a2a14;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 17px; margin: 24px 0 8px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .pill { padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px;
          background: var(--card); color: var(--text); font-size: 14px; }
  .pill.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .pill.warn { border-color: var(--warn); color: var(--warn); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .flag { display: inline-block; background: var(--warn-bg); color: var(--warn);
          border-radius: 6px; padding: 0 6px; font-size: 12px; font-weight: 600; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 14px; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg);
          border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  input[type=checkbox] { width: auto; }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 0; cursor: pointer;
           background: var(--accent); color: #fff; margin-top: 12px; }
  button.danger { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .msg { padding: 6px 10px; border-radius: 8px; margin: 6px 0; max-width: 85%; white-space: pre-wrap; }
  .msg.in { background: var(--bg); border: 1px solid var(--line); }
  .msg.out { background: var(--accent); color: #fff; margin-left: auto; }
</style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>
