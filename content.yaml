# Everything the bot says lives here. Edit freely, then restart the app.
# {name} is replaced with the person's Instagram username when known.

# Comment one of these words on a post (or DM it) to start the funnel.
# Matching is case-insensitive and ignores punctuation.
keywords:
  - PLAN
  - GUIDE
  - T1D

links:
  guide: https://example.com/t1d-lifting-guide
  booking: https://calendly.com/your-name/t1d-coaching-call
  privacy: https://example.com/privacy

# Public reply posted under the comment (optional, leave blank to skip).
# Instagram shows it to everyone, so never mention health details here.
public_comment_reply: "Sent you a DM 📩"

messages:
  # First DM, sent as a private reply to the comment or after a keyword DM.
  welcome: >-
    Hey {name}! Here's the free guide you asked for 👉 {guide}

    Want me to ask 3 quick questions to see if 1:1 coaching would suit you?
    Some of them touch on your diabetes, so I'll only store your answers
    to help with coaching (privacy info: {privacy}). You can reply
    DELETE at any time to have them wiped.

  consent_yes_button: "Yes, ask away"
  consent_no_button: "No thanks"
  consent_prompt_retry: "No worries. Just tap one of the buttons, or reply YES or NO."

  declined: >-
    All good, enjoy the guide! If you ever want to chat about training
    with T1D, just send me a message.

  finished: >-
    Thanks {name}, that's really helpful! 🙌 Based on what you've told me,
    the next step is a free 20-minute call so we can map out a plan:
    {booking}

    I'll also have a look at your answers myself and get back to you.

  stopped: >-
    Done. You won't get any more automatic messages from me. If you
    message me again, I'll reply personally.

  deleted: >-
    Done. I've deleted the answers you gave me. You won't get any more
    automatic messages.

# The qualifying questions, asked in order once the person has consented.
# "options" become tap-to-reply buttons (max 13, each title max 20 chars).
# Leave "options" out for a free-text question. People can always type
# their own answer instead of tapping a button.
questions:
  - key: goal
    text: "1/3: What's your main goal right now?"
    options:
      - Build muscle
      - Lose fat
      - Steadier glucose
      - Get stronger
      - Something else

  - key: experience
    text: "2/3: How much training experience do you have?"
    options:
      - Beginner
      - 1-3 years
      - 3+ years

  - key: diabetes_duration
    text: "3/3: How long have you had type 1?"
    options:
      - Under 1 year
      - 1-5 years
      - 5-15 years
      - 15+ years
